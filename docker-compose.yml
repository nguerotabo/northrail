services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: northrail
      POSTGRES_PASSWORD: northrail
      POSTGRES_DB: northrail
    ports:
      - "5432:5432"
    volumes:
      - northrail_pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  northrail_pg:
